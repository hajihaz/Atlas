# Alembic configuration. The DB URL is injected from Atlas settings (env), not stored here.
[alembic]
script_location = database/migrations
prepend_sys_path = src
path_separator = os
# sqlalchemy.url is intentionally omitted — env.py reads it from ATLAS_DB_URL (ADR 0009:
# no credentials in source).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
