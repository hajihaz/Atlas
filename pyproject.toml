# Atlas — Phase 2 Data Foundation
# Packaging & tooling. See docs/development/development-foundation.md and ADR 0010.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlas"
version = "0.2.0"                     # 0.<phase>.<iteration>
description = "Atlas — the trustworthy market-data foundation for the Jarvis quantitative division"
readme = "README.md"
requires-python = ">=3.11"           # production target 3.12; pure core is written to also run on 3.9 (CI matrix)
license = { text = "UNLICENSED" }    # personal system; not distributed
authors = [{ name = "Atlas Division" }]

# NOTE: Atlas's *domain core* (atlas.common, atlas.data.bitemporal/quality/calendars/
# adjustments/universe/snapshots/lineage, atlas.trials) depends on ZERO third-party
# packages — it is pure stdlib, so it is trivially testable and reproducible. Heavy
# dependencies live only in the persistence / ingestion / CLI adapter layers, in keeping
# with the loose-coupling mandate of ADR 0002.
dependencies = [
  "sqlalchemy>=2.0,<3.0",            # ORM + Core (persistence adapter)
  "alembic>=1.13,<2.0",             # schema migrations
  "psycopg[binary]>=3.2,<4.0",      # PostgreSQL driver
  "pydantic>=2.7,<3.0",             # record/config validation (adapter boundary)
  "pydantic-settings>=2.3,<3.0",    # 12-factor config from env
  "typer>=0.12,<1.0",               # CLI
  "structlog>=24.1",                # structured, auditable logging
  "urllib3>=2.8,<3.0",              # security floor: fixes 2026 advisories in 2.7
  "pyarrow>=16.0",                  # Parquet columnar snapshots / cold storage
]

[project.optional-dependencies]
# Free local-only research dependencies; no broker entitlement included.
integrations = [
  "duckdb>=1.1,<3",
  "pytz>=2025.1",
  "backtrader==1.9.78.123",
]
# Batch/dataframe ingestion & validation (kept optional so the core stays lean).
ingest = [
  "pandas>=2.2,<3.0",
  "pandera>=0.20",
  "httpx>=0.27",                    # vendor fetch (no live vendor wired in Phase 2)
]
dev = [
  "setuptools>=83.0.0",             # GitHub CI audit security floor; fixes PYSEC-2026-3447
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",              # property-based tests (invariants)
  "ruff>=0.5",                      # lint + format
  "mypy>=1.10",                     # strict static typing
  "pip-audit>=2.7",                 # dependency vulnerability scan (supply-chain)
  "pre-commit>=3.7",
  "detect-secrets>=1.5",            # secret scanning (threat model)
]

[project.scripts]
atlas = "atlas.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

# ----------------------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F=pyflakes, I=isort, UP=pyupgrade, B=bugbear, S=flake8-bandit (security),
# DTZ=flake8-datetimez (tz-aware datetimes — critical for point-in-time correctness).
select = ["E", "F", "I", "UP", "B", "S", "DTZ", "RUF"]
ignore = ["S101"]                    # asserts allowed in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
# The pure core must have no untyped escapes; adapters may relax per-module if needed.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
  "unit: pure-stdlib domain logic; no external deps (runs anywhere, incl. python -m unittest)",
  "integration: requires a live PostgreSQL (skipped when ATLAS_TEST_DB is unset)",
  "reproducibility: proves determinism / bit-for-bit or by-provenance reproducibility",
]

[tool.coverage.run]
branch = true
source = ["atlas"]

[tool.coverage.report]
show_missing = true
fail_under = 85
