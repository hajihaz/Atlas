name: atlas-paper-scheduled
on:
  # Retired comparison strategies: archived research may only be invoked manually.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-paper-scheduled
  cancel-in-progress: false
jobs:
  virtual-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ATLAS_EXECUTION_MODE: PAPER_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard against accidental live trading
        run: |
          test "${ATLAS_EXECUTION_MODE}" = "PAPER_ONLY"
          test ! -f frontend/public/real-orders.json
      - name: Source-revalidated forward checkpoint with bounded conflict recovery
        run: bash scripts/publish_scheduled_paper.sh
