name: atlas-ui
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/export_atlas_dashboard.py'
      - '.github/workflows/atlas-ui.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/export_atlas_dashboard.py'
      - '.github/workflows/atlas-ui.yml'
permissions:
  contents: read
jobs:
  verify-public-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: node --test frontend/tests/market-quotes.test.mjs
      - run: node --test frontend/tests/closed-candles.test.mjs
      - run: node --test frontend/tests/theme-contract.test.mjs
      - run: npm run build --prefix frontend
