name: atlas-ui
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'research/**'
      - 'tests/research/**'
      - 'tests/nse-certification/**'
      - 'docs/research/advanced/**'
      - 'scripts/**/*.mjs'
      - 'scripts/**/*.js'
      - 'scripts/export_atlas_dashboard.py'
      - 'scripts/publish_scheduled_paper.sh'
      - '.github/workflows/atlas-paper-scheduled.yml'
      - '.github/workflows/atlas-ui.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'research/**'
      - 'tests/research/**'
      - 'tests/nse-certification/**'
      - 'docs/research/advanced/**'
      - 'scripts/**/*.mjs'
      - 'scripts/**/*.js'
      - 'scripts/export_atlas_dashboard.py'
      - 'scripts/publish_scheduled_paper.sh'
      - '.github/workflows/atlas-paper-scheduled.yml'
      - '.github/workflows/atlas-ui.yml'
permissions:
  contents: read
concurrency:
  # Cancel superseded PR runs to save hosted-CI minutes; never cancel main runs.
  group: atlas-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify-public-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - name: Run every tracked JavaScript regression suite
        shell: bash
        run: git ls-files -z -- '*.test.mjs' | xargs -0 node --test
      - name: Verify approved upstream intake
        run: node scripts/check_upstream_intake.mjs
      - name: Verify source-bound advanced research and fail-closed ScalpStorm
        run: |
          node research/advanced/certify.mjs
          node --input-type=module -e "import r from './docs/research/advanced/certification.json' with {type:'json'}; if (r.historicalPerformanceCertified !== false || r.realOrdersEnabled !== false || r.tests.failed !== 0 || r.tests.passed < 101) process.exit(1)"
      - run: npm run build --prefix frontend
