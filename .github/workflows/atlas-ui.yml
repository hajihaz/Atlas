name: atlas-ui
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/export_atlas_dashboard.py'
      - '.github/workflows/atlas-ui.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/export_atlas_dashboard.py'
      - '.github/workflows/atlas-ui.yml'
permissions:
  contents: read
jobs:
  verify-public-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: node --test scripts/tests/upstream-intake.test.mjs
      - run: node --test scripts/tests/scalpstorm_equal_weight.test.mjs
      - run: node scripts/check_upstream_intake.mjs
      - run: node --test frontend/tests/market-quotes.test.mjs
      - run: node --test frontend/tests/closed-candles.test.mjs
      - run: node --test frontend/tests/theme-contract.test.mjs
      - run: node --test frontend/tests/premium-ui.test.mjs
      - run: node --test frontend/tests/market-inr.test.mjs
      - run: node --test frontend/tests/ist-12-hour.test.mjs
      - run: node --test frontend/tests/market-history.test.mjs
      - run: node --test frontend/tests/market-stream.test.mjs
      - run: node --test frontend/tests/live-feed.test.mjs
      - run: node --test frontend/tests/market-news.test.mjs
      - run: node --test frontend/tests/research-engine.test.mjs
      - run: node --test frontend/tests/paper-engine.test.mjs
      - run: node --test frontend/tests/cloud-paper.test.mjs
      - run: node --test frontend/tests/workbench-ui.test.mjs
      - run: node --test frontend/tests/scalpstorm-allocation-ui.test.mjs
      - run: node --test frontend/tests/agent-council.test.mjs
      - run: node --test frontend/tests/council-engine.test.mjs
      - run: npm run build --prefix frontend
