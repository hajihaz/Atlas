name: atlas-python-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci_ephemeral_only
          POSTGRES_DB: atlas_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas_ci"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      # CI-only database. Never point these test URLs at production.
      ATLAS_TEST_DB: postgresql+psycopg://atlas_ci:atlas_ci_ephemeral_only@localhost:5432/atlas_ci
      ATLAS_EXECUTION_TEST_DB: postgresql+psycopg://atlas_ci:atlas_ci_ephemeral_only@localhost:5432/atlas_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade audited packaging tooling
        run: python -m pip install --upgrade 'setuptools>=83.0.0'
      - name: Install Atlas and development tooling
        run: python -m pip install -e '.[dev]'
      - name: Install hash-pinned optional research runtime
        run: python -m pip install --require-hashes -r requirements/runtime.lock
      - name: Lint and strict type check
        run: |
          python -m ruff check src tests scripts
          python -m mypy src/atlas
      - name: Verify owner-local MCP transport with artificial records
        run: PYTHONPATH=src python scripts/verify_owner_mcp.py
      - name: Run Python and PostgreSQL integration tests
        run: python -m pytest -q --disable-warnings --strict-markers
      - name: Isolated PostgreSQL logical backup and restore drill
        env:
          ATLAS_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci_postgres_backup_restore.sh
      - name: Isolated PostgreSQL physical base-backup verification
        env:
          ATLAS_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci_postgres_physical_backup_verify.sh
      - name: Repeat safety, crash-recovery and rounding regressions
        run: |
          for iteration in 1 2 3; do
            echo "Safety repeat $iteration"
            python -m pytest -q \
              tests/unit/test_forged_policy_and_client_idempotency.py \
              tests/unit/test_sandbox_submission_gate.py \
              tests/unit/test_sandbox_submission_integrity.py \
              tests/unit/test_sandbox_observation_reconciliation.py \
              tests/unit/test_order_observation_journal.py \
              tests/unit/test_risk_stress_certification.py \
              tests/unit/test_historical_missing_bar_guard.py \
              tests/unit/test_research_input_failsafe.py \
              tests/unit/test_observation_journal_integrity_extended.py \
              tests/unit/test_offline_sqlite_backup_restore.py \
              tests/unit/test_haor_adverse_market_and_actions.py \
              tests/unit/test_haor_interrupt_and_reconciliation.py \
              tests/unit/test_haor_alert_signing_jarvis.py \
              tests/unit/test_market_observation_providers.py
          done
      - name: Synthetic offline risk-stress contract
        run: PYTHONPATH=src python scripts/risk_stress_certify.py
      - name: Audit Python dependencies
        run: python -m pip_audit
      - name: Scan source for accidental secrets
        run: |
          python -m detect_secrets scan src scripts tests pyproject.toml --all-files --exclude-files '^scripts/lean-smoke/(bin|obj)/' > /tmp/atlas-ci-secrets.json
          python -c 'import json; d=json.load(open("/tmp/atlas-ci-secrets.json")); assert not d.get("results"), d.get("results")'
